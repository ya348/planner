<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برنامه‌ریز هفتگی</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>برنامه‌ریز هفتگی</h1>
    <div class="table-responsive">
      <table class="planner-table">
        <thead>
          <tr>
            <th>روز هفته</th>
            <th>برنامه صبح</th>
            <th>برنامه ظهر</th>
            <th>برنامه شب</th>
          </tr>
        </thead>
        <tbody id="planner-body"></tbody>
      </table>
    </div>
    <div class="action-buttons">
      <button id="saveBtn">ذخیره برنامه</button>
      <button id="clearBtn">پاک‌سازی</button>
      <button id="canvasBtn">مشاهده گرافیکی</button>
      <button id="graphicalViewBtn">مشاهده لیستی</button>
    </div>
  </div>
</body>
</html>
